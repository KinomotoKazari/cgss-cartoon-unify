<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CGSS Emitter Inspector</title><link rel="stylesheet" href="./player.css"></head>
<body><main class="standalone-shell">
  <header class="topbar"><nav class="page-nav" aria-label="Pages"><a href="./index.html">Card preview</a><a class="active" href="./emitter_debug.html">Emitter inspector</a></nav></header>
  <section class="hero"><div><h1>Inspect Emitter Info</h1><p>Choose a card_cartoon_*.unity3d file to process</p></div></section>
